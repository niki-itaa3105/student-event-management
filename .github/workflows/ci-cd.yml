name: CI/CD Pipeline - Student Event Management

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Job 1: Build & Test ────────────────────────────
  build-and-test:
    name: Build & Test Flask App
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: eventdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run App Smoke Test
        run: |
          echo "App dependencies installed successfully"
          python -c "from flask import Flask; print('Flask OK')"

  # ── Job 2: Docker Build & Push ─────────────────────
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/student-event-app:latest ./app

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/student-event-app:latest

  # ── Job 3: Deploy ──────────────────────────────────
  deploy:
    name: Deploy via Docker Compose
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy with Docker Compose
        run: |
          echo "Deploying application..."
          docker compose up -d --build
          echo "✅ Deployment complete!"
