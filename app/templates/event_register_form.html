{% extends 'base.html' %}
{% block content %}
<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card p-4">
        <h4 class="fw-bold mb-1"><i class="bi bi-bookmark-plus text-danger"></i> Event Registration</h4>
        <p class="text-muted mb-4">Registering for: <strong>{{ event.title }}</strong></p>

        <div class="alert alert-light border mb-4">
          <div class="row small text-muted">
            <div class="col-6"><i class="bi bi-calendar3"></i> {{ event.event_date }}</div>
            <div class="col-6"><i class="bi bi-geo-alt"></i> {{ event.location }}</div>
          </div>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
            <input type="tel" name="phone" class="form-control" placeholder="e.g. 9876543210" required maxlength="15"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">College Name <span class="text-danger">*</span></label>
            <input type="text" name="college" class="form-control" placeholder="e.g. Anna University" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
            <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Year of Study <span class="text-danger">*</span></label>
            <select name="year" class="form-select" required>
              <option value="" disabled selected>Select year</option>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Food Preference <span class="text-danger">*</span></label>
            <select name="food_pref" class="form-select" required>
              <option value="" disabled selected>Select preference</option>
              <option value="Veg">Veg</option>
              <option value="Non-Veg">Non-Veg</option>
            </select>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check-circle"></i> Confirm Registration</button>
            <a href="/events" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
