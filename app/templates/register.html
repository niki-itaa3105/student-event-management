{% extends 'base.html' %}
{% block content %}
<div class="container d-flex justify-content-center mt-5">
  <div class="card p-4" style="width:100%;max-width:450px;">
    <h4 class="text-center mb-4 fw-bold"><i class="bi bi-person-plus text-danger"></i> Create Account</h4>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Your full name" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="student@college.edu" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6"/>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0">Already have an account? <a href="/login" class="text-danger">Login</a></p>
  </div>
</div>
{% endblock %}
